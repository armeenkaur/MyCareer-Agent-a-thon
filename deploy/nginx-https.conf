# mycareercompass.mmt.com — nginx TLS (system cert paths)
# Installed via scripts/vm-install-certs-system.sh

# App owns :80 (HTTP). nginx only :443 → proxy to app.
upstream mycareer_app {
    server 127.0.0.1:80;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name mycareercompass.mmt.com;

    ssl_certificate     /etc/ssl/certs/mycareercompass.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/mycareercompass.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://mycareer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://mycareer_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
