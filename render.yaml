services:
  - type: web
    name: mycareer-compass
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m skillsync_ai.app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: "0.0.0.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
